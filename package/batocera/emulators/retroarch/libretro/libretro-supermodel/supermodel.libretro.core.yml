shared_features:
  - autosave
  - use_guns
custom_features:
  supermodel_resolution:
    group: GRAPHICS
    prompt: INTERNAL RESOLUTION
    description: Enhancement. Increase the 3D rendering resolution. Native is 496x384. Restarts core.
    choices:
      Half (248x192): half
      Native (496x384): native
      2x (992x768): 2x
      3x (1488x1152): 3x
      4x (1984x1536): 4x
  supermodel_supersampling:
    group: GRAPHICS
    prompt: SUPERSAMPLING
    description: Render several internal samples per output pixel for cleaner edges. Applies on top of INTERNAL RESOLUTION and is very demanding at high values. Restarts core.
    choices:
      Off (1x): '1'
      2x (4 samples): '2'
      3x (9 samples): '3'
      4x (16 samples): '4'
      5x (25 samples): '5'
      6x (36 samples): '6'
      7x (49 samples): '7'
      8x (64 samples): '8'
  supermodel_wide_screen:
    group: GRAPHICS
    prompt: WIDESCREEN HACK
    description: Render a true 16:9 field of view instead of stretching. May cause glitches in some games. Restarts core.
    choices:
      'Off': disabled
      Widescreen: enabled
      Widescreen + wide background: wide_background
  supermodel_crt_colors:
    group: GRAPHICS
    prompt: CRT COLOR EMULATION
    description: Supermodel's own CRT colour and gamma adaptation, separate from any shader. Restarts core.
    choices:
      None (Default): '0'
      ARI/D93 (recommended for all JP developed games): '1'
      PVM_20M2U/D93: '2'
      BT601_525/D93: '3'
      BT601_525/D65 (recommended for all US developed games): '4'
      BT601_625/D65 (recommended for all EUR/AUS developed games): '5'
  supermodel_upscale_mode:
    group: GRAPHICS
    prompt: 2D LAYER UPSCALE FILTER
    description: Filter used to upscale the 2D tile layers when INTERNAL RESOLUTION is above native. Restarts core.
    choices:
      None/Sharp Pixels: '0'
      Biquintic: '1'
      Bilinear (Default): '2'
      Bicubic: '3'
  supermodel_no_white_flash:
    group: GRAPHICS
    prompt: DISABLE WHITE FLASHES
    description: Prevents bright white transitions during scene changes in games like Daytona 2 or Scud Race. Restarts core.
    choices:
      'No': disabled
      'Yes': enabled
  supermodel_av_timing:
    group: GRAPHICS
    prompt: ACCURATE REFRESH RATE
    description: Run at the real arcade speed of 57.524 Hz instead of 60 Hz. Best with a VRR display, and needs multi-threaded emulation. Restarts core.
    choices:
      Off (60Hz): 60hz
      On (57.524Hz): native
  supermodel_renderer_3d:
    group: GRAPHICS
    prompt: 3D ENGINE
    description: New3D is the current engine. Legacy3D is experimental and only for GPUs that struggle with New3D. Restarts core.
    choices:
      New3D (Default): new3d
      Legacy3D (Experimental): legacy3d
  supermodel_quad_rendering:
    group: GRAPHICS
    prompt: QUAD RENDERING
    description: Draw quads natively instead of splitting them into triangles. Needs OpenGL 4.5 and the New3D engine. Restarts core.
    choices:
      'Off': disabled
      'On': enabled
  supermodel_crosshairs:
    group: LIGHT GUN
    prompt: SHOW LIGHT GUN CROSSHAIRS
    description: Draw Supermodel's own crosshairs in shooting games for the selected players.
    choices:
      None: '0'
      P1 only: '1'
      P2 only: '2'
      P1 & P2: '3'
  supermodel_gun_input:
    group: LIGHT GUN
    prompt: GUN INPUT SOURCE
    description: Which inputs steer the cursor in light gun games. Standard combines light gun, mouse and the left analog stick.
    choices:
      Standard (Default): hybrid
      Light gun only: lightgun
      Mouse + analog stick: mouse_analog
      Mouse only: mouse
      Analog stick only: analog
  supermodel_star_wars_input:
    group: LIGHT GUN
    prompt: STAR WARS TRILOGY INPUT SOURCE
    description: Which inputs drive the analog joystick of Star Wars Trilogy Arcade.
    choices:
      Standard (Default): hybrid
      Light gun only: lightgun
      Mouse + analog stick: mouse_analog
      Mouse only: mouse
      Analog stick only: analog
  supermodel_force_feedback:
    prompt: RUMBLE
    description: Only some games feature rumble. Not compatible with all controllers.
    choices:
      'Off': disabled
      'On': enabled
  supermodel_four_speed_shifter:
    group: DRIVING
    prompt: 4-SPEED SHIFTER
    description: Only for 4-speed driving games. H-Gate picks gears from the four diagonal stick positions, Standard maps one input per gear.
    choices:
      H-Gate (Default): h_gate
      Standard: standard
  supermodel_steering_response:
    group: DRIVING
    prompt: STEERING RESPONSE
    description: Steering curve for driving games. Progressive and FBNeo Logarithmic are less sensitive around the centre.
    choices:
      Linear (Default): linear
      Progressive (fine centre): progressive
      FBNeo Logarithmic (fine centre): fbneo
  supermodel_steering_output_range:
    group: DRIVING
    prompt: STEERING RANGE
    description: Scale steering around its centre. Below 100% reduces the wheel range, above 100% reaches full lock with less stick travel.
    choices:
      50%: '50'
      60%: '60'
      63% (30-80-D0): '63'
      70%: '70'
      80%: '80'
      90%: '90'
      100% (Default): '100'
      110%: '110'
      120%: '120'
      130%: '130'
      140%: '140'
      150%: '150'
  supermodel_accelerator_output_range:
    group: DRIVING
    prompt: ACCELERATOR RANGE
    description: Scale the accelerator output. Above 100% reaches full output with less trigger travel.
    choices:
      50%: '50'
      60%: '60'
      70%: '70'
      75.3% (00-C0): '75.3'
      80%: '80'
      90%: '90'
      100% (Default): '100'
      110%: '110'
      120%: '120'
      130%: '130'
      140%: '140'
      150%: '150'
  supermodel_brake_output_range:
    group: DRIVING
    prompt: BRAKE RANGE
    description: Scale the brake output. Above 100% reaches full output with less trigger travel.
    choices:
      50%: '50'
      60%: '60'
      70%: '70'
      75.3% (00-C0): '75.3'
      80%: '80'
      90%: '90'
      100% (Default): '100'
      110%: '110'
      120%: '120'
      130%: '130'
      140%: '140'
      150%: '150'
  supermodel_sound_volume:
    group: AUDIO
    prompt: SOUND VOLUME
    description: Volume of the game's sound effects.
    choices:
      0%: '0'
      20%: '20'
      40%: '40'
      60%: '60'
      80%: '80'
      100% (Default): '100'
      120%: '120'
      140%: '140'
      160%: '160'
      180%: '180'
      200%: '200'
  supermodel_music_volume:
    group: AUDIO
    prompt: MUSIC VOLUME
    description: Volume of the digital music board (Sega Rally 2, Virtua Fighter 3 and others).
    choices:
      0%: '0'
      20%: '20'
      40%: '40'
      60%: '60'
      80%: '80'
      100% (Default): '100'
      120%: '120'
      140%: '140'
      160%: '160'
      180%: '180'
      200%: '200'
  supermodel_scsp_dsp:
    group: AUDIO
    prompt: SCSP SOUND ENGINE
    description: The new engine is more accurate. Try Legacy for games with sound problems, such as Fighting Vipers 2. Restarts core.
    choices:
      New (MAME-based): new
      Legacy (ElSemi): legacy
  supermodel_ppc_frequency:
    group: ADVANCED OPTIONS
    prompt: ADJUST POWERPC FREQUENCY
    description: Change the speed of the emulated PowerPC chip. Underclocking is the biggest speed-up on weak hardware, at the cost of accuracy. Auto follows the game's hardware stepping.
    choices:
      Auto (Default): auto
      25 MHz: '25'
      33 MHz: '33'
      50 MHz: '50'
      66 MHz: '66'
      70 MHz: '70'
      100 MHz: '100'
      133 MHz: '133'
      166 MHz: '166'
      200 MHz: '200'
  supermodel_emulation_threading:
    group: ADVANCED OPTIONS
    prompt: EMULATION THREADING
    description: How emulation work is spread across CPU threads. Restarts core.
    choices:
      Single thread: single
      Multi-threaded: multi
      Multi-threaded + GPU (Default): multi_gpu
  supermodel_frameskip:
    group: ADVANCED OPTIONS
    prompt: FRAME SKIP
    description: Skip rendering every N frames to reduce GPU load on slow hardware.
    choices:
      'Off': '0'
      Skip 1: '1'
      Skip 2: '2'
      Skip 3: '3'
  supermodel_network_board:
    group: ADVANCED OPTIONS
    prompt: NETWORK BOARD
    description: Connect the emulated Model 3 network board. Some games only show their network settings in the Service Menu while it is connected. Restarts core.
    choices:
      Connected (Default): enabled
      Disconnected: disabled
  supermodel_initial_nvram_setup:
    group: ADVANCED OPTIONS
    prompt: AUTOMATIC INITIAL NVRAM SETUP
    description: On a game's first boot, set it to Single / Stand Alone / No Link so it does not stop at a network check. Existing saves are never changed. Restarts core.
    choices:
      On (Default): enabled
      'Off': disabled
  supermodel_timing_overlay:
    group: ADVANCED OPTIONS
    prompt: FRAME TIMING OVERLAY
    description: Show per-frame timing statistics. Costs an extra draw pass, so leave off unless profiling.
    choices:
      'Off': disabled
      'On': enabled
file_extensions:
  - zip
systems:
  - model3
