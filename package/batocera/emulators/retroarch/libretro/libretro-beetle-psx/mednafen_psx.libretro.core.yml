    group: BEETLE SPECIFIC
    submenu: System
    prompt: SHOW BIOS BOOTLOGO
    description: Enhancement. Skipping it can break some games.
    choices:
      Show: disabled
      Skip: enabled
  beetle_psx_hw_cpu_freq_scale:
