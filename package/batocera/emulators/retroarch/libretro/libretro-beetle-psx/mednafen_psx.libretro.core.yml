  beetle_psx_hw_gpu_overclock:
    group: BEETLE SPECIFIC
    submenu: System
    prompt: GPU RASTERIZER OVERCLOCK
    description: Overclocks the 2D rasterizer in the emulated GPU. Does not improve 3D rendering, little effect in general.
    choices:
      1x (Native): 1x(native)
      2x: 2x
      4x: 4x
      8x: 8x
      16x: 16x
      32x: 32x
  beetle_psx_hw_gte_overclock:
    group: BEETLE SPECIFIC
    submenu: System
    prompt: GTE OVERCLOCK
    description: Lowers all emulated GTE (3D coprocessor) operations to one-cycle latency. Improves frame rate/stability in GTE-heavy games.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_cd_access_method:
    group: BEETLE SPECIFIC
    submenu: System
    prompt: CD ACCESS METHOD
    description: Asynchronous can reduce stuttering on slow storage. Pre-Cache loads the whole disk image at launch (needs enough RAM, falls back to Synchronous for physical media). Restart required.
    choices:
      Synchronous: sync
      Asynchronous: async
      Pre-Cache: precache
  beetle_psx_hw_cd_fastload:
    group: BEETLE SPECIFIC
    submenu: System
    prompt: CD LOADING SPEED
    description: Above 2x (Native) can greatly reduce loading times but may introduce timing errors; some games may misbehave above a certain value.
    choices:
      2x (Native): 2x(native)
      4x: 4x
      6x: 6x
      8x: 8x
      10x: 10x
      12x: 12x
      14x: 14x
  beetle_psx_hw_override_bios:
    group: BEETLE SPECIFIC
    submenu: System
    prompt: OVERRIDE BIOS
    description: Use a region-free BIOS instead of the region-specific one, if found. Restart required.
    choices:
      'Off': disabled
      PSP PS1 BIOS: psxonpsp
      PS3 PS1 BIOS: ps1_rom
      OpenBIOS: openbios
  beetle_psx_hw_region:
    group: BEETLE SPECIFIC
    submenu: System
    prompt: SYSTEM REGION
    description: Fallback region used when content can't be auto-detected (e.g. raw PS-EXE files). Disc-based games still use the region embedded on the disc. Restart required.
    choices:
      Auto: auto
      NTSC-J (Japan): ntsc-j
      NTSC-U (North America): ntsc-u
      PAL (Europe): pal
  beetle_psx_hw_internal_resolution:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: RENDERING RESOLUTION
    description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
    choices:
      1x (320x240): 1x(native)
      2x (640x480): 2x
      4x (1280x960): 4x
      8x (2560x1920): 8x
      16x (5120x3840): 16x
  beetle_psx_hw_aspect_ratio:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: CORE ASPECT RATIO
    description: Ignored when Widescreen Hack is enabled.
    choices:
      Corrected: corrected
      Uncorrected: uncorrected
      Force 4:3: '4:3'
      Force NTSC: ntsc
      Force 16:9: '16:9'
  beetle_psx_hw_deinterlacer:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: DEINTERLACE METHOD
    description: How interlaced video is displayed. Weave keeps full resolution on still images, Bob/FastMAD trade resolution for smoother motion, Off matches the hardware renderer's behaviour.
    choices:
      Weave: weave
      Bob: bob
      Bob (Offset): bob_offset
      FastMAD (Motion Adaptive): fastmad
      'Off': 'off'
  beetle_psx_hw_renderer:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: RENDERER
    description: Hardware (Auto) picks Vulkan or OpenGL based on the video driver. Software is the most accurate but slowest at higher internal resolutions. Restart required.
    choices:
      Hardware (Auto): hardware
      Hardware (OpenGL): hardware_gl
      Hardware (Vulkan): hardware_vk
      Software: software
  beetle_psx_hw_renderer_software_fb:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: SOFTWARE FRAMEBUFFER
    description: Accurately emulates framebuffer effects (motion blur, FF7 battle swirl) on hardware renderers. Disabling can improve performance but may cause graphical errors.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_depth:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: INTERNAL COLOR DEPTH
    description: Higher color depth reduces banding without dithering. Recommended to disable Dithering Pattern when set to 32 bpp.
    choices:
      16 bpp (Native): 16bpp(native)
      32 bpp: 32bpp
  beetle_psx_hw_dither_mode:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: DITHERING PATTERN
    description: Internal Resolution scales dithering to the rendering resolution. Recommended to disable when running at 32 bpp.
    choices:
      1x (Native): 1x(native)
      Internal Resolution: internal resolution
      'Off': disabled
  beetle_psx_hw_filter:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: TEXTURE FILTERING
    description: Nearest emulates original hardware. Bilinear/3-Point smooth via blurring. SABR/xBR/JINC2 are upscaling filters. Hardware renderers only.
    choices:
      Nearest: nearest
      SABR: SABR
      xBR: xBR
      Bilinear: bilinear
      3-Point: 3-point
      JINC2: JINC2
  beetle_psx_hw_filter_exclude_sprite:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: EXCLUDE SPRITES FROM FILTERING (VULKAN)
    description: Prevents seams in 2D sprite-rendered backgrounds. Vulkan renderer only.
    choices:
      'Off': disabled
      Opaque Only: opaque
      Opaque and Semi-Transparent: all
  beetle_psx_hw_filter_exclude_2d_polygon:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: EXCLUDE 2D POLYGONS FROM FILTERING (VULKAN)
    description: 2D polygons are detected with a heuristic and there may be glitches. Vulkan renderer only.
    choices:
      'Off': disabled
      Opaque Only: opaque
      Opaque and Semi-Transparent: all
  beetle_psx_hw_scaled_uv_offset:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: TEXTURE UV OFFSET (VULKAN)
    description: Reduces texture seams at higher internal resolutions but may cause glitches. Vulkan renderer only.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_adaptive_smoothing:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: ADAPTIVE SMOOTHING (VULKAN)
    description: Smooths 2D artwork and UI without blurring 3D objects. Vulkan renderer only.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_super_sampling:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: SUPERSAMPLING (VULKAN)
    description: Downsamples upscaled internal resolution back to native, anti-aliasing 3D objects. Vulkan renderer only.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_msaa:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: MULTI-SAMPLED ANTI ALIASING (VULKAN)
    description: Improves the appearance of 3D objects. Vulkan renderer only.
    choices:
      1x: 1x
      2x: 2x
      4x: 4x
      8x: 8x
      16x: 16x
  beetle_psx_hw_mdec_yuv:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: MDEC YUV CHROMA FILTER (VULKAN)
    description: Reduces macroblocking artifacts in FMV playback. Vulkan renderer only.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_track_textures:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: TRACK TEXTURES
    description: Prerequisite for texture dumping and replacement. Experimental - may crash in some games.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_dump_textures:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: DUMP TEXTURES
    description: Dump textures used by the game to a folder next to the game image, as a starting point for building an HD texture pack.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_hd_dump_mode:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: HD DUMP MODE
    description: Layout used when dumping textures (experimental). Page-aligned dumps whole VRAM texture pages for cleaner tiles; packs from the two modes are not interchangeable.
    choices:
      Upload-Rect (Default): upload_rect
      Page-Aligned (Experimental): page_aligned
      Both: both
  beetle_psx_hw_replace_textures:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: REPLACE TEXTURES
    description: Replace textures with HD versions from a texture pack placed next to the game image. No effect without a pack installed.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_texture_directory:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: HD TEXTURE FOLDER LOCATION
    description: 'Where texture dump/replacement folders are kept: next to the game image (default), or centralised under RetroArch''s System/Save directory. Each game still gets its own subfolder.'
    choices:
      Content Directory (Default): content
      System Directory: system
      Save Directory: save
  beetle_psx_hw_hd_replacement_mode:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: HD REPLACEMENT MODE
    description: Where replacement textures are looked up (experimental), independent of HD Dump Mode. Page-aligned packs are not interchangeable with Upload-rect packs.
    choices:
      Upload-Rect (Default): upload_rect
      Page-Aligned (Experimental): page_aligned
  beetle_psx_hw_hd_replacement_fallback:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: HD REPLACEMENT CROSS-MODE FALLBACK
    description: On a miss in the active HD Replacement Mode, also check the other mode's folder before falling back to the native texture. Best with the Lazy caching method.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_reduce_palette_range:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: HD REDUCE PALETTE RANGE
    description: Hash only the palette entries a texture actually uses instead of the whole palette, so one replacement keeps matching as games rewrite unused palette entries. Most useful for 8bpp textures; re-dump to benefit.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_hd_caching_method:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: HD TEXTURE CACHING METHOD
    description: How HD replacement textures are loaded. Eager prefetches everything up front; Lazy loads on first use in the background (possible pop-in); Lazy Synchronous loads on first use but blocks until ready (no pop-in, possible stutter).
    choices:
      Eager (Default): eager
      Lazy (Async): lazy
      Lazy (Synchronous): lazy_sync
  beetle_psx_hw_hd_cache_vram_budget:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: HD TEXTURE VRAM CACHE BUDGET
    description: Maximum VRAM used to keep HD replacement textures resident. Higher is smoother but can exhaust VRAM on smaller GPUs. Only used with Replace Textures.
    choices:
      256 MB: '256'
      512 MB: '512'
      1 GB: '1024'
      1.5 GB: '1536'
      2 GB: '2048'
      3 GB (Default): '3072'
      4 GB: '4096'
      6 GB: '6144'
      8 GB: '8192'
  beetle_psx_hw_hd_cache_ram_budget:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: HD TEXTURE RAM CACHE BUDGET
    description: Maximum system RAM used to keep decoded HD replacement textures, so they don't have to be re-read from disk. Only used with Replace Textures.
    choices:
      256 MB: '256'
      512 MB: '512'
      1 GB: '1024'
      2 GB (Default): '2048'
      4 GB: '4096'
      8 GB: '8192'
  beetle_psx_hw_core_timing_fps:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: CORE-REPORTED FPS TIMING
    description: Automatic Toggling allows the core to switch between progressive and interlaced rates.
    choices:
      Automatic Toggling: auto_toggle
      Force Progressive Rate: force_progressive
      Force Interlaced Rate: force_interlaced
  beetle_psx_hw_frame_duping:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: FRAME DUPING (SPEEDUP)
    description: Repeat the previous frame if the core has nothing new to display.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_pal_video_timing_override:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: PAL VIDEO TIMING OVERRIDE
    description: PAL games often run slower than their NTSC counterparts. Overrides PAL timings to attempt the NTSC framerate instead.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_crop_overscan:
    group: BEETLE SPECIFIC
    submenu: Video
    prompt: CROP OVERSCAN
    description: Full native image, or crop to remove borders.
    choices:
      Disabled: disabled
      Horizontal: static
      Horizontal + Vertical: smart
