  beetle_psx_hw_pgxp_mode:
    group: BEETLE SPECIFIC
    submenu: PGXP (Precision Geometry Transform Pipeline)
    prompt: PGXP OPERATION MODE
    description: Subpixel-precise 3D rendering, reducing jitter/distortion. Memory Only is recommended; Memory + CPU can cause geometry errors.
    choices:
      'Off': disabled
      Memory Only: memory only
      Memory + CPU (Buggy): memory + CPU
  beetle_psx_hw_pgxp_2d_tol:
    group: BEETLE SPECIFIC
    submenu: PGXP (Precision Geometry Transform Pipeline)
    prompt: PGXP 2D GEOMETRY TOLERANCE
    description: Tolerance for keeping PGXP values on geometries without proper depth information.
    choices:
      'Off': disabled
      0px: 0px
      1px: 1px
      2px: 2px
      3px: 3px
      4px: 4px
      5px: 5px
      6px: 6px
      7px: 7px
      8px: 8px
  beetle_psx_hw_pgxp_nclip:
    group: BEETLE SPECIFIC
    submenu: PGXP (Precision Geometry Transform Pipeline)
    prompt: PGXP PRIMITIVE CULLING
    description: Reduces holes in PGXP geometries. Known to cause lock-ups in some games.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_pgxp_vertex:
    group: BEETLE SPECIFIC
    submenu: PGXP (Precision Geometry Transform Pipeline)
    prompt: PGXP VERTEX CACHE
    description: Caches PGXP-enhanced vertex positions. May cause glitches from false cache hits. Only applies when PGXP Operation Mode is enabled, hardware renderers only.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_pgxp_texture:
    group: BEETLE SPECIFIC
    submenu: PGXP (Precision Geometry Transform Pipeline)
    prompt: PGXP PERSPECTIVE CORRECT TEXTURING
    description: Fixes affine texture warping/distortion. Only applies when PGXP Operation Mode is enabled.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_line_render:
    group: BEETLE SPECIFIC
    submenu: Emulation Hacks
    prompt: LINE-TO-QUAD HACK
    description: Fixes horizontal-line rendering (e.g. Doom, Hexen) on hardware renderers and upscaled resolutions. Aggressive is needed for some titles (Dark Forces, Duke Nukem) but may glitch others.
    choices:
      Default: default
      Aggressive: aggressive
      'Off': disabled
  beetle_psx_hw_widescreen_hack:
    group: BEETLE SPECIFIC
    submenu: Emulation Hacks
    prompt: WIDESCREEN HACK (GLITCHY)
    description: Enhancement. Only works with a 16/9 ratio and bezels disabled.
    choices:
      'Off': disabled
      'On': enabled
  beetle_psx_hw_widescreen_hack_aspect_ratio:
    group: BEETLE SPECIFIC
    submenu: Emulation Hacks
    prompt: WIDESCREEN HACK ASPECT RATIO
    description: Aspect ratio used by the Widescreen Hack.
    choices:
      '16:9': '16:9'
      '16:10': '16:10'
      '18:9': '18:9'
      '19:9': '19:9'
      '20:9': '20:9'
      '21:9': '21:9'
      '32:9': '32:9'
  beetle_psx_hw_spu_silent_voice:
    group: BEETLE SPECIFIC
    submenu: Emulation Hacks
    prompt: SPU SILENT VOICE OPTIMIZATION
    description: Skips per-sample processing of SPU voices whose envelope has fully released. Audio is unaffected; saves roughly 5-10% of frame time. Disable for fully accurate SPU register state.
    choices:
      On (Default): enabled
      'Off': disabled
  beetle_psx_hw_cpu_dynarec:
    group: BEETLE SPECIFIC
    submenu: Emulation Hacks
    prompt: CPU DYNAREC (SPEED UP)
    description: Much faster than interpreter (but may have issues).
    choices:
      Disabled (Beatle Interpreter): disabled
      Max Performance: execute
      Lightrec Interpreter: run_interpreter
  beetle_psx_hw_dynarec_invalidate:
    group: BEETLE SPECIFIC
    submenu: Emulation Hacks
    prompt: DYNAREC CODE INVALIDATION
    description: Some games require 'Full' invalidation, some require 'DMA Only'.
    choices:
      Full (Default): full
      DMA Only (Slightly Faster): dma
  beetle_psx_hw_dynarec_op_cycles:
    group: BEETLE SPECIFIC
    submenu: Emulation Hacks
    prompt: DYNAREC CYCLES PER INSTRUCTION (LIGHTREC)
    description: 2 is faster. Set 1 for games whose CD streaming stalls/hangs under the dynarec (e.g. Parasite Eve 2).
    choices:
      2 (Default): '2'
      1 (Accurate, Fixes Parasite Eve 2 etc.): '1'
  beetle_psx_hw_dynarec_eventcycles:
    group: BEETLE SPECIFIC
    submenu: Emulation Hacks
    prompt: DYNAREC DMA/GPU/MDEC/TIMER EVENT CYCLES (LIGHTREC)
    description: Max CPU cycles run before a GPU/DMA/MDEC/Timer update is checked. Higher is faster, has much less impact on the interpreter than the dynarec.
    choices:
      128 (Default): '128'
      '256': '256'
      '384': '384'
      '512': '512'
      '640': '640'
      '768': '768'
      '896': '896'
      '1024': '1024'
      '1152': '1152'
      '1280': '1280'
      '1408': '1408'
      '1536': '1536'
      '1664': '1664'
      '1792': '1792'
      '1920': '1920'
      '2048': '2048'
  beetle_psx_hw_dynarec_spu_samples:
    group: BEETLE SPECIFIC
    submenu: Emulation Hacks
    prompt: DYNAREC SPU SAMPLES
    description: Max SPU samples to run before a SPU Update is checked. Higher is faster, but causes sound glitches in some games with anything other than 1.
    choices:
      1 (Default): '1'
      '4': '4'
      '16': '16'
  beetle_psx_hw_dynarec_spgp_opt:
    group: BEETLE SPECIFIC
    submenu: Emulation Hacks
    prompt: DYNAREC SP/GP HIT RAM OPTIMIZATION
    description: Enabled generates faster code by assuming sp/gp registers always point to RAM, but may crash. Disabled is more widely compatible.
    choices:
      Off (Default): disabled
      'On': enabled
