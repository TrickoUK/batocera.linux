# Fork-only fixups: these systems' upstream default (in configgen-defaults.yml,
# or the standalone emulators disabled by no-mame.patch/the trimmed
# manufacturer-systems Config.in) isn't built for this fork's trimmed
# x86_64-focused board. Point each at the single libretro core this fork
# actually ships for it, so games launch without requiring a manual
# per-system core pick in batocera.conf.
